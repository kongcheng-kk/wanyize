<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>412万逸泽</title>
    <style>
        p{
            color: #94a;
            font-size:50px;
        }
        #box{
            width: 600px;
            height:500px;
            background-color: bisque;
        }
        .n1{
            color:blue;
        }
        /* 扩展2：h2黑底白字 */
        h2{
            background-color: black;
            color: white;
        }
        /* 扩展3：仅“选择器”三个字改为白色字，不要黑色背景 */
        .sel-word{
            color: #ffffff;
        }
        /* 扩展1：名字每个字不同颜色 */
        .w{color:blue;}
        .y{color:red;}
        .z{color:green;}
    </style>
</head>
<body>
    <h2>层叠样式表 CSS</h2>
    <div id="box">
        <p>CSS<span class="sel-word">选择器</span></p>
        <!--扩展1：名字的每个字不同颜色在同一行-->
        <p><span class="w">万</span><span class="y">逸</span><span class="z">泽</span></p>
        <p>CSS属性</p>
    </div>
    <!--扩展1：名字的每个字不同颜色在同一行-->
    <!--扩展2：h2黑底白字-->
    <!--扩展3：选择器文字为白色，无黑底-->
</body>
</html>
