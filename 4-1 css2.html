<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* ===== 上节课CSS（保留） ===== */
        #box {
            width: 500px;
            border: 1px solid #333;
            padding: 10px;
        }
        h3 {
            text-align: center;
        }
        /* ===== 本节课新增：内部CSS ===== */
        /* 学号：蓝色加粗 */
        .xuehao {
            color: blue;
            font-weight: bold;
        }
        /* 姓名：深色加粗 */
        .yname {
            color: #333;
            font-weight: bold;
        }
        /* 难度的值：红色加粗 */
        .nandu {
            color: red;
            font-weight: bold;
        }
        /* 知识点：紫色边框（额外内容） */
        .zsd {
            border: 1px solid purple;
            padding: 2px;
        }
    </style>
</head>
<body>
    <h2>css进阶</h2>
    <div id="box">
        <h3>CSS那些事</h3>
        <p>
            学号：<span class="xuehao">412</span>，姓名：<span class="yname">wanyize</span>，班级：计算机24004，
            对于《高级网页设计》课程的难度认知为：<span class="nandu">难</span>。
            这个例子对应的知识点是：<span class="zsd">群组选择器、后代选择器、层叠与继承</span>。
            <a href="#">更多>>></a>
        </p>
    </div>
    <!-- 学号：蓝色加粗；姓名：深色加粗，难度的值：红色加粗，知识点，紫色边框，边框为额外内容，使用内部css -->
</body>
</html>
