<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>15-1 逢7过 · 一百个盒子</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f4f5f7;
      color: #333;
      padding: 40px 20px;
    }
    h1 { text-align: center; font-size: 24px; margin-bottom: 8px; }
    .sub { text-align: center; color: #888; font-size: 13px; margin-bottom: 28px; }

    section {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      margin: 0 auto 24px;
      max-width: 860px;
      box-shadow: 0 2px 8px rgba(0,0,0,.05);
    }
    h2 {
      font-size: 16px;
      margin-bottom: 14px;
      padding-left: 10px;
      border-left: 4px solid #7c5cfc;
    }

    /* 规则说明 */
    .rules { display: flex; flex-wrap: wrap; gap: 10px; }
    .rule {
      flex: 1; min-width: 200px;
      background: #f5f3ff;
      border: 1px solid #e4defc;
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 13px;
      line-height: 1.8;
    }
    .rule b { color: #7c5cfc; }
    .rule code {
      display: block;
      margin-top: 6px;
      background: #2d2a3e;
      color: #a5f3c4;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 12px;
      font-family: Consolas, monospace;
    }

    /* 统计条 */
    .stats {
      display: flex; gap: 24px; flex-wrap: wrap;
      font-size: 14px; color: #666;
      margin-bottom: 18px;
    }
    .stats b { color: #7c5cfc; font-size: 18px; }
    .stats .empty-count b { color: #e5484d; }

    /* 一百个盒子：10 列网格 */
    .grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 8px;
    }
    .box {
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: #f2f3f7;
      font-size: clamp(12px, 2.2vw, 18px);
      font-weight: 600;
      color: #4a4a68;
      transition: transform .15s;
      cursor: default;
    }
    .box:hover { transform: scale(1.08); }

    /* 满足 7 规则的空盒子 */
    .box.empty {
      background: #ffeced;
      border: 1.5px dashed #f5a3a6;
      color: transparent;
    }
    .box.empty:hover { transform: scale(1.08); border-color: #e5484d; }

    .legend {
      display: flex; gap: 22px; flex-wrap: wrap;
      margin-top: 16px; font-size: 12px; color: #888;
    }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i {
      width: 14px; height: 14px; border-radius: 4px; display: inline-block;
    }
    .legend .i-normal { background: #f2f3f7; }
    .legend .i-empty { background: #ffeced; border: 1.5px dashed #f5a3a6; }

    @media (max-width: 560px) {
      .grid { grid-template-columns: repeat(5, 1fr); gap: 6px; }
    }
  </style>
</head>
<body>

  <h1>逢 7 过 · 一百个盒子</h1>
  <p class="sub">数字 1 ~ 100：满足 7 规则的显示为「空盒子」，不满足的显示数字</p>

  <!-- 规则说明 -->
  <section>
    <h2>7 的规则</h2>
    <div class="rules">
      <div class="rule">
        <b>规则一：7 的倍数</b><br>
        能被 7 整除的数字，如 7、14、21、28 …<br>
        <code>i % 7 === 0</code>
      </div>
      <div class="rule">
        <b>规则二：个位数是 7</b><br>
        如 7、17、27、37 …<br>
        <code>i % 10 === 7</code>
      </div>
      <div class="rule">
        <b>规则三：十位数是 7</b><br>
        如 70、71、72 … 79<br>
        <code>Math.floor(i / 10) === 7</code>
      </div>
    </div>
  </section>

  <!-- 盒子网格 -->
  <section>
    <h2>一百个盒子</h2>
    <div class="stats">
      <span>总盒子数 <b>100</b> 个</span>
      <span class="empty-count">触发 7 规则的空盒子 <b id="emptyCount">-</b> 个</span>
      <span>正常显示数字 <b id="numCount">-</b> 个</span>
    </div>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span><i class="i-normal"></i>不满足规则：显示数字</span>
      <span><i class="i-empty"></i>满足规则：显示空盒子</span>
    </div>
  </section>

  <script>
    // 判断数字是否满足 7 的规则
    function isSeven(i) {
      return i % 7 === 0            // 7 的倍数
          || i % 10 === 7           // 个位数是 7
          || Math.floor(i / 10) === 7; // 十位数是 7
    }

    var grid = document.getElementById('grid');
    var empty = 0;
    for (var i = 1; i <= 100; i++) {
      var box = document.createElement('div');
      box.className = 'box';
      if (isSeven(i)) {
        box.classList.add('empty');   // 满足规则：空盒子（不写数字）
        empty++;
      } else {
        box.textContent = i;          // 不满足规则：显示数字
      }
      box.title = isSeven(i) ? i + '（满足 7 规则，显示为空盒子）' : i;
      grid.appendChild(box);
    }
    document.getElementById('emptyCount').textContent = empty;
    document.getElementById('numCount').textContent = 100 - empty;
  </script>
</body>
</html>
